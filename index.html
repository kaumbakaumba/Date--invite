<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Question 💌</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffe4ec, #f7e8ff);
      color: #33212a;
      padding: 20px;
    }
    .card {
      width: min(92vw, 520px);
      background: rgba(255,255,255,.94);
      border-radius: 28px;
      padding: 34px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(90, 40, 70, .18);
    }
    .heart { font-size: 52px; }
    h1 { margin: 10px 0 8px; font-size: 32px; }
    p { color: #725965; line-height: 1.5; }
    form { display: grid; gap: 12px; margin-top: 22px; text-align: left; }
    label { font-weight: 700; font-size: 14px; }
    input, textarea {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ead5df;
      border-radius: 13px;
      font: inherit;
      outline: none;
    }
    input:focus, textarea:focus { border-color: #d85b87; }
    textarea { resize: vertical; min-height: 75px; }
    .question {
      margin: 24px 0 12px;
      font-size: 20px;
      font-weight: 800;
      text-align: center;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
    }
    button {
      border: 0;
      border-radius: 999px;
      padding: 13px 24px;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
    }
    #yes { background: #d94f82; color: white; }
    #no {
      background: #eee;
      color: #888;
      cursor: not-allowed;
      opacity: .65;
    }
    #success {
      display: none;
      margin-top: 20px;
      padding: 18px;
      background: #fff0f5;
      border-radius: 18px;
      font-weight: 700;
    }
    small { display:block; margin-top:18px; color:#9a7c88; }
  </style>
</head>
<body>
  <main class="card">
    <div class="heart">💌</div>
    <h1>One Important Question</h1>
    <p>Before we get to the serious business, I need a few details from you 😌</p>

    <form id="dateForm" action="https://formsubmit.co/kaumbakaumba27@gmail.com" method="POST">
      <input type="hidden" name="_subject" value="❤️ She said YES to the date!">
      <input type="hidden" name="_captcha" value="false">
      <input type="hidden" name="_template" value="table">
      <div>
        <label for="name">Your name</label>
        <input id="name" name="Name" required placeholder="Your name">
      </div>

      <div>
        <label for="favorite">Favourite food</label>
        <input id="favorite" name="Favourite food" required placeholder="So I know what to order 👀">
      </div>

      <div>
        <label for="date">Ideal date idea</label>
        <textarea id="date" name="Ideal date idea" required placeholder="Dinner? Movies? Ice cream?"></textarea>
      </div>

      <div class="question">So... will you go on a date with me? 🥹</div>

      <div class="buttons">
        <button id="yes" type="submit">YES ❤️</button>
        <button id="no" type="button" disabled>NO 😭</button>
      </div>
    </form>

    <div id="success">
      LET'S GOOOOO! ❤️🥳<br>
      <span id="message"></span>
    </div>

    <small>Disclaimer: The unavailable NO button is purely for playful dramatic effect 😄</small>
  </main>

  <script>
    const form = document.getElementById("dateForm");
    const success = document.getElementById("success");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();

      success.style.display = "block";
      message.textContent =
        `${name}, noted! 💕 Your YES is being sent...`;

      // Let the form submit to the email service after showing the message.
      setTimeout(() => form.submit(), 700);
    });
  </script>
</body>
</html>
